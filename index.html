<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <script src="./rock-paper-scissors.js" defer></script>
  </head>
  <body>
    <div class="rps-buttons-container">
      <button class="rps-button rock" value="Rock">Rock</button>
      <button class="rps-button paper" value="Paper">Paper</button>
      <button class="rps-button scissors" value="Scissors">Scissors</button>
    </div>
    <div class="scoreboard-container">
      <p class="gm">Rock, Paper, Scissors!</p>
      <p class="roundWinner">
        Press a button to make your choice! First to 5 wins!
      </p>
      <p class="humanScoreboard">Player Score: 0</p>
      <p class="computerScoreboard">Computer Score: 0</p>
    </div>
  </body>
</html>
